version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ssme_db
      POSTGRES_USER: ssme_user
      POSTGRES_PASSWORD: ssme_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
      - media_files:/code/media
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://ssme_user:ssme_password@db:5432/ssme_db
      - SECRET_KEY=your-production-secret-key-change-this

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  media_files:
